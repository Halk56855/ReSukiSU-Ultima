name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Check the release APK
        run: |
          apk=$(find downloaded-artifacts -name "*.apk" | head -n 1)
          if [ -z "$apk" ] || [ ! -f "$apk" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          ls -la "$apk"

          name=$(basename "$apk")
          if ! printf '%s' "$name" | grep -Eq '^[^_]+_v.+_[0-9]+-[a-z]+\.apk$'; then
            echo "::error::$name does not match <app>_v<versionName>_<versionCode>-<buildType>.apk"
            exit 1
          fi

      - name: Package kernel bundle
        run: |
          ./scripts/package-release-kernel-bundle.sh . "ReSukiSU-Ultima_${GITHUB_REF_NAME}_kernel-bundle.zip"

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            downloaded-artifacts/*.apk
            ReSukiSU-Ultima_*_kernel-bundle.zip
