name: Build ksud

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      use_cache:
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/

    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit/*/release/ksuinit ./userspace/ksud/bin/aarch64/

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        targets: ${{ inputs.target }}
        # components: rust-src لم تعد حاجة ماسة لها هنا

    - name: Setup cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Clean previous build artifacts
      run: |
        cd userspace/ksud/
        cargo clean

    - name: Build ksud
      run: |
        # توجيه المتغير إلى مسار NDK المثبت مسبقاً في الـ Runner
        export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT}"
        echo "Using Android NDK at: $ANDROID_NDK_HOME"
        
        cd userspace/ksud/
        # تم إزالة -Z build-std لتجنب تضارب المكتبة القياسية
        cargo ndk b -t ${{ inputs.target }} -r -Z trim-paths

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v4
      with:
        name: ksud-${{ inputs.target }}
        path: userspace/ksud/target/**/release/ksud*
