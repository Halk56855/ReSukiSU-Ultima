name: Build ksud

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: true
      pack_ksuinit:
        required: false
        type: boolean
        default: true
      use_cache:
        required: false
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/

    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit/*/release/ksuinit ./userspace/ksud/bin/aarch64/

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: nightly
        targets: ${{ inputs.target }}
        components: rust-src

    - name: Get Nightly Version
      id: rust-version
      run: echo "version=$(rustc -V)" >> $GITHUB_OUTPUT

    - name: Cache Rust build dependencies
      uses: Swatinem/rust-cache@v2
      if: ${{ inputs.use_cache && github.event_name != 'pull_request' }}
      with:
        # Include rustc version in prefix-key to prevent build-std cache collision
        prefix-key: ksud-${{ inputs.target }}-${{ steps.rust-version.outputs.version }}
        workspaces: userspace/ksud
        cache-targets: true

    - name: Setup cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Build ksud
      run: |
        cd userspace/ksud/
        cargo ndk b -t ${{ inputs.target }} -r -Z build-std=std,core,panic_abort -Z build-std-features="optimize_for_size" -Z trim-paths
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path || env.ANDROID_NDK_HOME }}

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v4
      with:
        name: ksud-${{ inputs.target }}
        path: userspace/ksud/target/**/release/ksud*
